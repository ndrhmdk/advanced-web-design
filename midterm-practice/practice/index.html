<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Management</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="header">
        <div class="container navbar">
            <a href="#" class="logo">PRODUCT MANAGEMENT.</a>
            <nav>
                <a href="#products">Products</a>
                <a href="#management">Management</a>
            </nav>
        </div>
    </header>

    <!-- HEADER -->
    <section class="section" id="products">
        <div class="container">
            <p class="eyebrow">Product Collection</p>
            <h2>Products</h2>
            <div class="products-grid" id="product-list">
                <!-- generated by javascript -->
            </div>
        </div>
    </section>

    <!-- MANAGEMENT -->
    <section class="section" id="management">
        <div class="container">
            <p class="eyebrow">Operations</p>
            <h2>Management</h2>
            <div class="management-grid">
                <!-- The Form -->
                <form id="product-form" class="product-form">
                    <h3 id="form-title">Add Product</h3>

                    <input type="hidden" id="product-id">
                    <div class="form-group">
                        <label for="name">Product Name</label>
                        <input type="text" id="name" required>
                    </div>

                    <div class="form-group">
                        <label for="image">Image URL</label>
                        <input type="url" id="image" required>
                    </div>

                    <div class="form-group">
                        <label for="description">Description</label>
                        <textarea id="description" required></textarea>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="quantity">Quanitty</label>
                            <input type="number" id="quantity" min="0" required>
                        </div>

                        <div class="form-group">
                            <label for="price">Price</label>
                            <input type="number" id="price" min="0.01" step="0.01" required>
                        </div>
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn" id="submit-btn">Add Product</button>
                        <button type="button" class="btn btn-secondary" id="cancel-btn">Cancel</button>
                    </div>
                </form>

                <!-- TABLE -->
                <div class="table-wrapper">
                    <table>
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Image</th>
                                <th>Name</th>
                                <th>Description</th>
                                <th>Quantity</th>
                                <th>Price</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        
                        <tbody id="product-table">
                            <!-- generated by javascript -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </section>

    <footer class="footer">
        <div class="container">Product Management - JavaScript + MockAPI</div>
    </footer>

    <script src="js/product.js"></script>
    <script src="js/app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Women's Products</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="container">
        <header class="header-bar">
            <h1 class="section-title">Women's Products</h1>
            <ul class="nav-filters">
                <li><a href="#" class="active">All</a></li>
                <li><a href="#">Clothings</a></li>
                <li><a href="#">Bags</a></li>
                <li><a href="#">Shoes</a></li>
                <li><a href="#">Watches</a></li>
                <li><a href="#">Goggles</a></li>
            </ul>
        </header>

        <section class="products-grid">
            <article class="product-card">
                <div class="product-image"><img src="fig1.jpg" alt="Set 1"></div>
                <div class="product-body">
                    <h3 class="product-title">KARINA SET 1</h3>
                    <div class="card-bottom">
                        <div class="prices">
                            <span class="old-price">&euro;100.00</span>
                            <span class="current-price">&euro;75.00</span>
                        </div>
                        <button type="button" class="btn-cart">Add to Cart</button>
                    </div>
                </div>
            </article>

            <article class="product-card">
                <div class="product-image"><img src="fig2.jpg" alt="Set 2"></div>
                <div class="product-body">
                    <h3 class="product-title">KARINA SET 2</h3>
                    <div class="card-bottom">
                        <div class="prices">
                            <span class="old-price">&euro;100.00</span>
                            <span class="current-price">&euro;75.00</span>
                        </div>
                        <button type="button" class="btn-cart">Add to Cart</button>
                    </div>
                </div>
            </article>

            <aside class="banner-card">
                <img src="fig3.jpg" alt="For Women Collection">
                <div class="banner-overlay">
                <h2>For Women</h2>
                <a href="#" class="btn-banner">View All</a>
                </div>
            </aside>
        </section>
    </main>
</body>
</html>

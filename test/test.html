<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Management</title>
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="test.css">
</head>

<body>
    <!-- =========================
         MAIN CONTENT
    ========================== -->
    <main class="container py-5">
        <!-- Page Header -->
        <div class="page-header">
            <div>
                <h1>Staff Management</h1>
                <p class="page-description"> Manage your staff information </p>
            </div>
            <button type="button" class="btn btn-success add-button" id="btn-add"> + Add New Staff </button>
        </div>
        <!-- =========================
             STAFF TABLE
        ========================== -->
        <div class="table-card">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead>
                        <tr>
                            <th>No.</th>
                            <th>Avatar</th>
                            <th>Name</th>
                            <th>Gender</th>
                            <th>Birthday</th>
                            <th class="actions-column">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="staffTableBody">
                        <!-- Staff will be inserted here -->
                    </tbody>
                </table>
            </div>
        </div>
    </main>
    <!-- =========================
         ADD / EDIT MODAL
    ========================== -->
    <div class="modal-overlay" id="staffModal">
        <div class="staff-modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
            <!-- Modal Header -->
            <div class="modal-header-custom">
                <div>
                    <h2 id="modalTitle"> Add New Staff </h2>
                    <p id="modalDescription"> Enter the staff information below. </p>
                </div>
                <button type="button" class="modal-close" id="btn-close" aria-label="Close"> &times; </button>
            </div>
            <!-- Modal Form -->
            <form id="staffForm">
                <div class="form-group">
                    <label for="name"> Name </label>
                    <input type="text" id="name" name="name" required placeholder="e.g. Nina West">
                </div>
                <div class="form-group">
                    <label for="gender"> Gender </label>
                    <input type="text" id="gender" name="gender" required placeholder="e.g. Male">
                </div>
                <div class="form-group">
                    <label for="birthday"> Birthday </label>
                    <input type="date" id="birthday" name="birthday" required>
                </div>
                <div class="form-group">
                    <label for="avatar"> Avatar URL </label>
                    <input type="url" id="avatar" name="avatar" required placeholder="https://example.com/avatar.jpg">
                </div>
                <!-- Modal Actions -->
                <div class="form-actions">
                    <button type="button" class="btn-cancel" id="btn-cancel"> Cancel </button>
                    <button type="submit" class="btn-submit" id="btn-submit"> Add Staff </button>
                </div>
            </form>
        </div>
    </div>
    <!-- =========================
         DELETE CONFIRMATION MODAL
    ========================== -->
    <div class="modal-overlay" id="deleteModal">
        <div class="delete-modal">
            <div class="delete-icon"> ! </div>
            <h2>Delete Staff</h2>
            <p> Are you sure you want to delete <strong id="deleteStaffName"></strong>? </p>
            <p class="delete-warning"> This action cannot be undone. </p>
            <div class="delete-actions">
                <button type="button" class="btn-cancel" id="btn-delete-cancel"> Cancel </button>
                <button type="button" class="btn-delete-confirm" id="btn-delete-confirm"> Delete </button>
            </div>
        </div>
    </div>
    <!-- =========================
         JAVASCRIPT
    ========================== -->
    <script src="D:/VNUK ASSIGNMENTS/4rd YEAR/Advanced Web Design/session-04/fetch-show-add-edit-data-updated/config.js"></script>
    <script src="test.js"></script>
</body>

</html>

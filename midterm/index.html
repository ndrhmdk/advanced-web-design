<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TOURISM</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <header class="header">
        <div class="container navbar">
            <a href="#" class="logo">TOURISM</a>
            <nav>
                <a href="#tours">Tours</a>
                <a href="#management">Management</a>
            </nav>
        </div>
    </header>


    <section class="section" id="tours">
        <div class="container">
            <p class="eyebrow">Tour List</p>
            <h2>Tour</h2>
            <div class="tour-grid" id="tour-list">
                <!-- javascript -->
            </div>
        </div>
    </section>


    <section class="section section-muted" id="management">
        <div class="container">
            <p class="eyebrow">Operations</p>
            <h2>Tour Management</h2>
            <div class="management-grid">
                <!-- form -->
                <form id="tour-form" class="tour-form">
                    <h3 id="form-title">Add Tour</h3>
                    <input type="hidden" id="tour-id">
                    <div class="form-group">
                        <label for="tenTour">Tour Name</label>
                        <input type="text" id="tenTour" required>
                    </div>
                    <div class="form-group">
                        <label for="image">Image URL</label>
                        <input type="url" id="image" required>
                    </div>
                    <div class="form-group">
                        <label for="moTa">Description</label>
                        <textarea id="moTa" required></textarea>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="ngayKhoiHanh">Start Date</label>
                            <input type="date" id="ngayKhoiHanh" required>
                        </div>
                        <div class="form-group">
                            <label for="ngayKetThuc">End Date</label>
                            <input type="date" id="ngayKetThuc" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="giaTour">Tour Price</label>
                        <input type="number" id="giaTour" min="0" step="0.01" required>
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn" id="submit-btn">Add Tour</button>
                        <button type="button" class="btn btn-secondary" id="cancel-btn">Cancel</button>
                    </div>
                </form>


                <!-- table -->
                <div class="table-wrapper">
                    <table>
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Image</th>
                                <th>Tour Name</th>
                                <th>Description</th>
                                <th>Start Date</th>
                                <th>End Date</th>
                                <th>Price</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="tour-table">
                            <!-- javascript -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </section>

    <footer class="footer">Tourism @ VN</footer>

    <script src="js/tourdulich.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
